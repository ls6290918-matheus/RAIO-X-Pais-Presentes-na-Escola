<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F7A3D">
<title>Raio-X Pais Presentes na Escola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F6F2;--card:#fff;--ink:#14231B;--muted:#5E6B63;--green:#0F7A3D;--green-d:#0A5A2C;--green-soft:#E6F3EA;--sun:#F2C200;--sun-soft:#FFF6D6;--line:#E4E6DF;--red:#B3261E;--blue:#1E3A8A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.5}
button,input{font:inherit}
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.topin{max-width:600px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px}
.brand{font-weight:900;letter-spacing:1.8px;font-size:13px;color:#3E4A43;display:flex;gap:8px;align-items:center}
.brand b{color:var(--green)}
.flag{width:22px;height:14px;border-radius:3px;background:linear-gradient(90deg,var(--green) 0 40%,var(--sun) 40% 70%,#1E3A8A 70%)}
.back{border:0;background:none;color:var(--ink);font-size:28px;width:34px;cursor:pointer;visibility:hidden}
.back.show{visibility:visible}
.pct{font-weight:900;color:var(--green);width:44px;text-align:right;font-size:14px}
.pbar{height:5px;background:var(--line)}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--sun));transition:width .35s ease}
.wrap{max-width:600px;margin:0 auto;padding:24px 18px 60px;min-height:calc(100vh - 65px)}
.screen{animation:in .28s ease both}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chip{display:inline-block;background:var(--green-soft);color:var(--green);font-weight:900;font-size:11px;letter-spacing:1.2px;padding:7px 12px;border-radius:99px;margin-bottom:14px;text-transform:uppercase}
h1{font-size:clamp(29px,7vw,39px);line-height:1.08;font-weight:900;letter-spacing:-1px;margin-bottom:14px}
h2{font-size:clamp(25px,6vw,31px);line-height:1.13;font-weight:900;letter-spacing:-.6px;margin-bottom:14px}
h3{font-size:19px;line-height:1.2;font-weight:900;margin-bottom:9px}
.hl{color:var(--green)}
.lead{color:var(--muted);font-size:17px;margin-bottom:20px}
.small{font-size:13px;color:var(--muted);line-height:1.5}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:18px 0}
.pcard{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;padding:15px 14px;font:inherit;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.04);transition:transform .15s,border-color .15s;min-height:104px}
.pcard:active,.opt:active{transform:scale(.985)}
.pcard .ph{font-size:29px;margin-bottom:8px}.pcard .lb{font-size:15px;font-weight:800;line-height:1.25}.pcard.wide{grid-column:1/-1;min-height:74px;display:flex;align-items:center;gap:14px}.pcard.wide .ph{margin:0}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:17px;padding:15px 16px;font:inherit;font-weight:700;font-size:16px;color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s,transform .15s;min-height:68px}
.opt:hover,.pcard:hover{border-color:#9AC9A9}.opt .e{font-size:25px;flex:0 0 31px;text-align:center}.opt .ar{margin-left:auto;color:var(--green);font-size:22px;font-weight:900}
.btn{display:block;width:100%;border:0;cursor:pointer;background:var(--green);color:#fff;font-weight:900;font-size:17px;padding:17px 18px;border-radius:16px;text-align:center;text-decoration:none;box-shadow:0 8px 20px rgba(15,122,61,.2);margin-top:18px}
.btn.sun{background:var(--sun);color:#1B2A12;box-shadow:0 8px 20px rgba(242,194,0,.22)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hero{border-radius:22px;overflow:hidden;margin-bottom:20px;background:linear-gradient(135deg,#E6F3EA,#FFF6D6);padding:25px 22px}
.hero-icon{font-size:48px;margin-bottom:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:19px;margin:15px 0;box-shadow:0 4px 14px rgba(0,0,0,.035)}
.proof{background:#fff;border:1px solid #CFE3D4;border-left:5px solid var(--green);border-radius:18px;padding:18px;margin:18px 0}
.proof .source{font-size:13px;color:var(--muted);margin-top:12px}
.proof a{color:var(--green-d);font-weight:800;text-decoration:underline}
.quote{background:var(--green-soft);border-radius:14px;padding:15px;margin-top:12px;font-size:15px;line-height:1.55}
.tip{background:var(--sun-soft);border-radius:16px;padding:16px;margin:15px 0;font-size:15px}
.tip b{display:block;margin-bottom:5px}
.pill{display:inline-block;background:var(--sun-soft);color:#594600;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:900;letter-spacing:.5px}
.result-list{display:grid;gap:10px;margin:14px 0}
.result-item{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.result-item .e{font-size:24px;flex:0 0 30px}.result-item b{display:block;margin-bottom:3px}.result-item span{font-size:14px;color:var(--muted)}
.certificate{border:2px double #B8962E;background:#FFFEF8;border-radius:12px;padding:20px;text-align:center;margin:16px 0}.certificate .ct{font-family:"Cormorant Garamond",serif;color:#0B3D22;font-size:24px;font-weight:700;line-height:1.1}.certificate .cn{font-family:"Cormorant Garamond",serif;color:var(--blue);font-size:27px;margin:8px 0;border-bottom:1px solid #D8C68F;padding-bottom:6px}.certificate .cs{font-size:11px;letter-spacing:1.5px;color:#8A6D1D;margin:5px 0 10px}
.formrow{margin:14px 0}.formrow label{display:block;font-weight:800;margin-bottom:7px}.formrow input{width:100%;padding:15px;border:2px solid var(--line);border-radius:14px;font-size:16px;background:#fff;outline:none}.formrow input:focus{border-color:var(--green)}
.ck{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:13px;margin-top:12px}.ck input{width:20px;height:20px;flex:0 0 20px;accent-color:var(--green);margin-top:2px}
.err{color:var(--red);font-size:13px;margin-top:6px;min-height:18px}
.pricebox{border:2px solid var(--green);border-radius:20px;overflow:hidden;background:#fff;margin:20px 0}
.pricebox .hd{background:var(--green);color:#fff;text-align:center;font-weight:900;letter-spacing:1.3px;padding:11px}
.pricebox .bd{padding:18px}.pricehead{display:flex;justify-content:space-between;align-items:center;gap:12px}.val{font-size:40px;font-weight:900;color:var(--green-d);white-space:nowrap}.val small{font-size:17px}
.items{display:grid;gap:9px;margin:15px 0}.it{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}.it .e{font-size:25px;flex:0 0 30px}.it b{display:block;font-size:15px}.it span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:12px;color:var(--muted);font-weight:700;margin-top:15px}.trust span{display:block;font-size:22px;margin-bottom:3px}
.faq details{border-top:1px solid var(--line);padding:13px 0}.faq summary{font-weight:800;cursor:pointer;list-style:none}.faq summary::after{content:"+";float:right;color:var(--green)}.faq details[open] summary::after{content:"–"}.faq p{color:var(--muted);margin-top:8px;font-size:14px}
.person{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.person .ph{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.person .av{flex:0 0 46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;font-size:16px}
.person .nm{font-weight:900;font-size:17px;line-height:1.2}.person .rl{font-size:13px;color:var(--muted)}
.person .lb{font-size:11px;font-weight:900;letter-spacing:1px;color:var(--green);text-transform:uppercase;margin:10px 0 4px}
.person ul{padding-left:18px;font-size:15px}.person li{margin-bottom:6px}
.person .says{background:var(--green-soft);border-radius:12px;padding:11px 13px;font-size:14.5px}
.person figure{margin:12px 0 4px}.person figure img{width:100%;border-radius:12px;display:block}.person figcaption{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45}.person figcaption b{color:var(--ink)}
.person .src{font-size:12.5px;color:var(--muted);margin-top:10px}.person .src a{color:var(--green-d);font-weight:700}
.realhoax{position:relative;margin:16px 0;border-radius:16px;overflow:hidden;border:3px solid #E53935}
.realhoax img{display:block;width:100%}
.realhoax .band{position:absolute;top:12px;left:12px;background:#E53935;color:#fff;font-weight:900;font-size:13px;letter-spacing:1px;padding:7px 11px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.fake{position:relative;border-radius:18px;overflow:hidden;margin:16px 0;background:linear-gradient(180deg,#3a3f3c 0%,#1d201e 55%,#000 100%);aspect-ratio:4/5;max-height:430px}
.fake .ph{position:absolute;inset:0 0 45% 0;background:repeating-linear-gradient(90deg,#4b524d 0 14px,#555c57 14px 30px);filter:blur(6px);opacity:.7}
.fake .tx{position:absolute;left:18px;right:18px;bottom:22px;filter:blur(3.5px)}
.fake .tx i{display:block;height:15px;border-radius:4px;background:#fff;margin-bottom:9px}
.fake .tx i.r{background:#C62828}
.fake .stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);border:5px solid #E53935;color:#E53935;background:rgba(255,255,255,.92);font-weight:900;font-size:30px;letter-spacing:3px;padding:8px 18px;border-radius:10px;text-align:center;line-height:1.05;white-space:nowrap}
.fake .stamp small{display:block;font-size:12px;letter-spacing:1.5px}
.checks{display:grid;gap:10px;margin:14px 0}
.checks .c{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}
.checks .c .x{flex:0 0 28px;height:28px;border-radius:50%;background:#FDECEA;color:var(--red);font-weight:900;display:grid;place-items:center}
.checks .c b{display:block}.checks .c span{font-size:14px;color:var(--muted)}
.side{border-radius:18px;padding:16px;margin:12px 0;border:1px solid var(--line);background:#fff}
.side h3{display:flex;gap:8px;align-items:center}.side ul{padding-left:18px;font-size:15px}.side li{margin-bottom:7px}
.side .who{font-size:13px;color:var(--muted);margin:-4px 0 8px}
.side.crit{border-left:5px solid #C2410C}.side.def{border-left:5px solid #1E3A8A}.side.fact{border-left:5px solid var(--green);background:var(--green-soft)}
.side .src{font-size:12.5px;color:var(--muted);margin-top:8px}.side .src a{color:var(--green-d);font-weight:700}
.scen{display:inline-block;background:#EEF2FF;color:#1E3A8A;border-radius:99px;padding:5px 10px;font-size:11px;font-weight:900;letter-spacing:.8px;margin-left:6px;vertical-align:middle}
.steps6{counter-reset:s;list-style:none;display:grid;gap:9px;margin:14px 0}
.steps6 li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;font-size:15px}
.steps6 li::before{content:counter(s);flex:0 0 28px;height:28px;border-radius:50%;background:var(--green);color:#fff;font-weight:900;display:grid;place-items:center}
.steps6 li b{display:block}
.fb{background:#EEF2FF;border-radius:14px;padding:14px;font-size:15px;margin:4px 0 12px}
.premium{border:2px solid var(--sun);background:linear-gradient(135deg,#FFF9E3,#FFF3C4)}
.premium .tag{display:inline-block;background:var(--sun);color:#1B2A12;font-size:10.5px;font-weight:900;letter-spacing:1px;padding:3px 8px;border-radius:6px;margin-bottom:4px}
.meter{max-width:600px;margin:0 auto;padding:8px 16px 10px;display:none}
.meter.show{display:block}
.meter .mt{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.3px;margin-bottom:5px}
.meter .mt b{font-size:15px;color:var(--ink)}
.meter .tr{position:relative;height:10px;border-radius:99px;background:var(--line);overflow:visible}
.meter .tr i{display:block;height:100%;border-radius:99px;width:0;transition:width .6s cubic-bezier(.2,.8,.2,1),background .4s}
.meter .goal{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.35}
.plus{position:fixed;z-index:60;font-weight:900;font-size:15px;color:#fff;background:var(--green);padding:3px 9px;border-radius:99px;box-shadow:0 4px 10px rgba(0,0,0,.15);pointer-events:none;animation:plus 1s ease-out forwards}
.plus.zero{background:#8A948E}
@keyframes plus{from{opacity:0;transform:translateY(8px)}20%{opacity:1}to{opacity:0;transform:translateY(-30px)}}
.scorebig{background:#fff;border:2px solid var(--line);border-radius:22px;padding:20px;margin:16px 0}
.scorebig .num{font-size:52px;font-weight:900;line-height:1}.scorebig .num small{font-size:20px;color:var(--muted)}
.scorebig .lvl{display:inline-block;font-weight:900;font-size:12px;letter-spacing:.8px;padding:5px 10px;border-radius:99px;margin:8px 0 14px}
.scorebig .bar{position:relative;height:22px;border-radius:99px;overflow:hidden;background:repeating-linear-gradient(45deg,#FDECEA 0 8px,#F9D9D4 8px 16px)}
.scorebig .bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.scorebig .goal{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--ink)}
.scorebig .legend{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:8px;font-weight:700}
.gap{display:grid;gap:9px;margin-top:14px}
.gap .g{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:14px;padding:12px}
.gap .g .p{flex:0 0 auto;font-weight:900;color:var(--red);font-size:14px;background:#FDECEA;border-radius:99px;padding:4px 9px}
.gap .g b{display:block;font-size:14.5px}.gap .g span{font-size:13px;color:var(--muted)}
.lifetime{display:flex;gap:10px;align-items:center;background:var(--green-soft);border:1px dashed var(--green);border-radius:14px;padding:12px 14px;margin:14px 0 4px;font-size:14.5px}
.lifetime .e{font-size:26px}.lifetime b{display:block;color:var(--green-d)}
.val .once{display:block;font-size:12px;font-weight:800;color:var(--muted);text-align:right;letter-spacing:.5px}
.certwrap{container-type:inline-size;margin:14px 0 4px}
.cert2{aspect-ratio:297/210;background:#FFFFFF;border:1.3cqw solid #009739;padding:.9cqw;box-shadow:0 8px 26px rgba(0,39,118,.14);position:relative;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cert2 .c2in{position:relative;height:100%;border:.55cqw double #C9A227;display:flex;flex-direction:column;align-items:center;text-align:center;padding:3cqw 7cqw 2.2cqw;background:radial-gradient(circle at 50% 42%,rgba(255,223,0,.08),transparent 60%),#FFFFFF;overflow:hidden}
.cert2 .c2in::before,.cert2 .c2in::after{content:"";position:absolute;width:9cqw;height:9cqw;background:linear-gradient(135deg,#009739 0 33%,#FFDF00 33% 50%,transparent 50%)}
.cert2 .c2in::before{top:0;left:0}
.cert2 .c2in::after{bottom:0;right:0;transform:rotate(180deg)}
.c2top{display:flex;align-items:center;gap:1cqw;font-weight:900;font-size:1.75cqw;letter-spacing:.45cqw;color:#009739}
.c2top svg{width:3cqw;height:auto;display:block}
.c2title{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:5.4cqw;line-height:1;color:#002776;margin-top:.9cqw;letter-spacing:.15cqw}
.c2bar{display:flex;width:22cqw;height:.45cqw;margin:1.3cqw auto 0}.c2bar i{flex:1}
.c2lbl{font-size:1.5cqw;font-weight:800;letter-spacing:.5cqw;color:#5E6B63;margin-top:2cqw}
.c2name{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:5.6cqw;line-height:1.05;color:#009739;margin-top:.6cqw;padding:0 3cqw .5cqw;border-bottom:.3cqw solid #C9A227;max-width:100%;overflow-wrap:anywhere}
.c2txt{font-size:1.72cqw;line-height:1.45;color:#2A332E;max-width:74cqw;margin-top:1.4cqw}
.c2done{font-weight:900;font-size:1.55cqw;letter-spacing:.4cqw;color:#A88514;margin-top:1.6cqw}
.c2foot{margin-top:auto;width:100%;display:grid;grid-template-columns:1fr 13cqw 1fr;align-items:end;gap:2cqw}
.c2foot .l,.c2foot .r{font-size:1.35cqw;color:#2A332E;line-height:1.35;border-top:.18cqw solid #002776;padding-top:.7cqw}
.c2foot .r b{display:block;color:#002776;font-size:1.45cqw;letter-spacing:.15cqw}
.c2foot .r i{font-style:italic;color:#5E6B63}
.c2wm{position:absolute;inset:0;z-index:5;display:grid;place-items:center;pointer-events:none;font-weight:900;font-size:13cqw;letter-spacing:2cqw;color:rgba(0,39,118,.13);transform:rotate(-18deg)}
.c2foot .seal svg{width:13cqw;height:auto;display:block}
@media print{
 @page{size:A4 landscape;margin:0}
 html,body{background:#fff!important}
 .top,.meter,.foot{display:none!important}
 .wrap{padding:0!important;max-width:none!important;min-height:0!important}
 #app>section>*:not(.certwrap):not(#certbox){display:none!important}
 #app>section{animation:none!important}
 .certwrap{width:296mm;margin:0!important}
 .cert2{box-shadow:none}
}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:22px;line-height:1.5}
.tst{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 4px 14px rgba(0,0,0,.035)}
.tst .st{color:#E0A100;font-size:15px;letter-spacing:2px;margin-bottom:6px}
.tst p{font-size:15px;line-height:1.5;margin-bottom:10px}
.tst .who{display:flex;gap:10px;align-items:center;font-weight:800;font-size:14px}
.tst .who i{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:900;font-size:12px}
.tst .who small{display:block;font-weight:600;color:var(--green);font-size:11.5px}
.tsts{display:grid;gap:10px;margin:14px 0}
.tsth{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:22px}
.tsth .avg{font-size:13px;font-weight:800;color:var(--muted)}.tsth .avg b{color:#E0A100}
.carousel{display:flex;gap:11px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;margin:10px 0 4px;-webkit-overflow-scrolling:touch}
.carousel .tst{flex:0 0 84%;scroll-snap-align:start}
.swipe{font-size:12px;color:var(--muted);text-align:center;font-weight:700}
.moret summary{list-style:none;cursor:pointer;text-align:center;font-weight:800;color:var(--green-d);border:2px solid var(--line);border-radius:14px;padding:12px;background:#fff}.moret summary::-webkit-details-marker{display:none}.moret[open] summary{display:none}
.tst.mini{background:var(--green-soft);border-color:#CFE3D4;margin-top:14px;box-shadow:none}
@media(max-width:390px){.wrap{padding:20px 14px 45px}.opt{padding:13px;font-size:15px}.pricehead{align-items:flex-start}.val{font-size:34px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <button class="back" id="back" aria-label="Voltar">‹</button>
    <div class="brand"><img src="img/logo.jpg" alt="Pais Presentes na Escola" style="height:44px;width:auto;display:block"><span style="line-height:1.15">RAIO-X<br><b style="letter-spacing:0;font-size:12.5px;white-space:nowrap">Pais Presentes na Escola</b></span></div>
    <div class="pct" id="pct"></div>
  </div>
  <div class="pbar"><i id="bar"></i></div>
  <div class="meter" id="meter"><div class="mt"><span>SUA PONTUAÇÃO DE PRESENÇA ESCOLAR</span><b id="mval">0/100</b></div><div class="tr"><i id="mbar"></i><div class="goal" style="left:80%" title="Meta: 80"></div></div></div>
</header>
<div class="wrap"><main id="app" aria-live="polite"></main></div>
<script>

function esc(s){return String(s ?? "").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function setProgress(p){document.getElementById("bar").style.width=Math.max(0,Math.min(100,p))+"%";document.getElementById("pct").textContent=p?Math.round(p)+"%":"";}
function render(html,stage,progress,canBack=true){app.innerHTML=`<section class="screen">${html}</section>`;state.stage=stage;setProgress(progress);back.classList.toggle("show",canBack);window.scrollTo({top:0,behavior:"smooth"});}
function next(){state.index++;step();}
function pickMarkup(items,kind){return `<div class="opts">${items.map((o,i)=>`<button class="opt" type="button" data-value="${esc(o[2])}"><span class="e">${o[0]}</span><span>${o[1]}</span><span class="ar">›</span></button>`).join("")}</div>`;}

 {type:"debate",title:"O que está em debate sobre gênero nas escolas",intro:"Esse tema divide opiniões no Brasil. Veja, lado a lado, o que defende cada grupo e quais fatos não estão em disputa.",crit:{who:"Movimentos de pais, parlamentares conservadores e grupos religiosos",items:["Abordar gênero e sexualidade na escola, principalmente com crianças pequenas, invade a formação moral que cabe primeiro à família.","As decisões do STF tiraram dos pais a possibilidade de afastar o filho dessas atividades por motivos morais ou religiosos.","Expressões amplas como “igualdade de gênero” podem abrir espaço para conteúdos sobre identidade de gênero sem consulta às famílias."]},def_:{who:"Governo federal, ministros do STF e entidades de educação",items:["O objetivo é combater a violência contra a mulher, o bullying e a discriminação.","Não existe uma disciplina chamada “ideologia de gênero”; o termo é usado pelos críticos.","Currículo e conteúdo são definidos em nível nacional, por isso estados e municípios não podem criar regras próprias de veto."]},facts:{items:["Em 2026, o STF derrubou as leis do Espírito Santo e do Maranhão que permitiam aos pais vetar a participação dos filhos em atividades escolares sobre gênero.","Não há uma matéria obrigatória de “ideologia de gênero” criada pelo governo ou pelo STF; checadores classificaram esse boato como falso.","Os pais continuam com o direito de conhecer a proposta pedagógica da escola e de participar das discussões (ECA, art. 53)."],links:[{label:"STF: lei do Maranhão",url:"https://noticias.stf.jus.br/postsnoticias/stf-invalida-lei-do-maranhao-que-permitia-aos-pais-vetar-participacao-dos-filhos-em-aulas-sobre-genero-e-sexualidade/"},{label:"Aos Fatos, nov/2026",url:"https://www.aosfatos.org/noticias/stf-ideologia-genero-escolas/"},{label:"ECA no Planalto",url:"https://www.planalto.gov.br/ccivil_03/leis/l8069.htm"}]},takeaway:"Seja qual for a sua posição, o caminho que funciona é o mesmo: saber o que a escola ensina, conversar com  {type:"proof",title:"Um caso real mostra por que é importante conferir a informação",image:{src:"img/post-eduardo-2018.png",alt:"Post de Eduardo Bolsonaro de 31/08/2018 com Jair Bolsonaro mostrando um livro no Jornal Nacional e a foto de outro livro com carimbo de escola",cap:"Reprodução de post publicado em 31/08/2018."},analysis:{title:"O que esse post mostra, e o que a checagem encontrou",points:["O post afirmava que o livro exibido no Jornal Nacional tinha carimbo de escola pública.","O livro com carimbo não é o mesmo: é “Sexo não é bicho-papão”, de Marcos Ribeiro, e não “Aparelho Sexual e Cia”.","O carimbo é da Escola Municipal Major Bonifácio Silveira, em Maceió (AL). A escola confirmou que o livro estava no acervo, mas disse que ele nunca foi usado pela equipe e que o retirou da sala de leitura por considerá-lo inadequado para os alunos."],lesson:"As duas coisas são verdade ao mesmo tempo: o post misturava dois livros diferentes, e um livro considerado inadequado chegou, sim, ao acervo de uma escola. Por isso vale conhecer o que a escola do seu filho oferece e conversar com ela quando algo te preocupar.",links:[{label:"Alagoas 24 Horas: checagem do caso (2018)",url:"https://www.alagoas24horas.com.br/1177621/e-fake-que-livro-citado-por-bolsonaro-no-jn-e-o-que-aparece-com-carimbo-de-escola-de-maceio/"},{label:"Livro “E a verdade os libertará”: resposta da escola",url:"https://www.everand.com/book/471530994/E-a-verdade-os-libertara-Reflexoes-sobre-religiao-politica-e-bolsonarismo"}]},text:"Entre 2010 e 2011, o então deputado Jair Bolsonaro afirmou que crianças de 7 a 10 anos receberiam um material do MEC sobre combate à homofobia e que o conteúdo estimularia a homossexualidade. O projeto Escola sem Homofobia — chamado por opositores de 'kit gay' — ainda estava em avaliação quando sua produção e distribuição foram suspensas em maio de 2011; não houve distribuição oficial nas escolas. Sobre o público-alvo, a cobertura contemporânea baseada em informações do MEC informou que não havia projeto de abordagem da homofobia para crianças de 6 a 10 anos e descreveu a distribuição planejada para escolas de ensino médio. Um estudo acadêmico posterior registra que os materiais também faziam referência a estudantes do 6º ao 9º ano. Por isso, é importante apresentar essa diferença de descrição, em vez de afirmar simplesmente que havia um kit pronto para ser entregue a crianças de 7 a 10 anos.\n\nEm 2018, durante entrevista ao Jornal Nacional, Bolsonaro exibiu o livro Aparelho Sexual e Cia e afirmou que ele fazia parte do chamado 'kit gay' e estaria em bibliotecas de escolas públicas. O MEC informou que não produziu, adquiriu ou distribuiu o livro, e as checagens confirmaram que ele não fazia parte do projeto Escola sem Homofobia. A compra pública de 28 exemplares citada na época foi feita pelo Ministério da Cultura para bibliotecas públicas, não pelo MEC para bibliotecas escolares.",example:"Antes de compartilhar ou concluir que um conteúdo está sendo usado pela escola, confira: quem publicou a informação? Qual é a data? Há documento oficial? O material citado é realmente o original? A escola pode explicar como a atividade foi trabalhada?",source:"Fontes: Câmara dos Deputados (2011); Folha de S.Paulo (2011); estudo acadêmico publicado na Série-Estudos (2019); nota do MEC reproduzida pelo Ministério dos Direitos Humanos (2016); Nova Escola (2018).",links:[{label:"Câmara: declarações de Bolsonaro em 2011",url:"https://www.camara.leg.br/noticias/209583-bolsonaro-quer-evitar-distribuicao-de-kit-anti-homofobia/"},{label:"Câmara: suspensão da produção em maio de 2011",url:"https://www.camara.leg.br/noticias/215309-pressao-de-bancadas-faz-governo-cancelar-kit-sobre-homossexualidade"},{label:"Folha: público previsto e informação do MEC",url:"https://m.folha.uol.com.br/poder/2011/05/920763-kit-gay-era-optativo-e-so-para-escolas-que-lidavam-com-bullying.shtml"},{label:"Estudo acadêmico sobre o projeto",url:"https://educa.fcc.org.br/scielo.php?pid const MAXPTS=Object.keys(SCORE).length*3;
function scoreNow(){let s=0;for(const k in SCORE){const v=state.answers[k];if(v!==undefined)s+=SCORE[k].pts[v]||0}return Math.round(s/MAXPTS*100)}
function answeredScored(){return Object.keys(SCORE).filter(k=>state.answers[k]!==undefined).length}
function lvlColor(p){return p<40?"#C62828":p<70?"#E0A100":"#0F7A3D"}
function lvlName(p){return p<40?"Presença em risco":p<70?"Presença em construção":p<80?"Quase lá":"Presença forte"}
function updateMeter(show){
  const m=document.getElementById("meter");
  if(!show||answeredScored()===0){m.classList.remove("show");return}
  m.classList.add("show");
  const p=scoreNow();document.getElementById("mval").textContent=p+"/100";
  const b=document.getElementById("mbar");b.style.width=p+"%";b.style.background=lvlColor(p);
}
function popPoints(n,el){
  const r=(el||document.getElementById("mval")).getBoundingClientRect();
  const d=document.createElement("div");d.className="plus"+(n?"":" zero");d.textContent=n?`+${n} pts`:"+0 pts";
  d.style.left=(r.left-78)+"px";d.style.top=(r.top-2)+"px";document.body.appendChild(d);setTimeout(()=>d.remove(),1000);
}

function step(){
  if(state.index>=FLOW.length){capture();return;}
  updateMeter(true);
  const f=FLOW[state.index];
  const progress=7+Math.round((state.index/FLOW.length)*82);
  if(f.type==="q") renderQuestion(f,progress); else if(f.type==="people") renderPeople(f,progress); else if(f.type==="hoax") renderHoax(f,progress); else if(f.type==="debate") renderDebate(f,progress); else if(f.type==="guide") renderGuide(f,progress); else renderProof(f,progress);
}
function renderQuestion(f,progress){
  render(`<span class="chip">${esc(f.section)} · pergunta ${FLOW.slice(0,state.index+1).filter(x=>x.type==="q").length} de ${FLOW.filter(x=>x.type==="q").length}</span>${f.scenario?'<span class="scen">IMAGINE</span>':""}
    <h2>${esc(f.q)}</h2><p class="lead">${esc(f.sub||"")}</p>${pickMarkup(f.o)}`,"flow",progress);
  app.querySelectorAll("[data-value]").forEach(b=>b.onclick=()=>{state.answers[f.id]=b.dataset.value;if(SCORE[f.id]){updateMeter(true);popPoints(SCORE[f.id].pts[b.dataset.value]||0,document.getElementById("mval"));setTimeout(next,450);}else next();});
}
function renderProof(f,progress){
  const links=(f.links||[]).map(l=>`<a href="${l.url}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(" · ");
  const proofText=esc(f.text).replace(/\n\n/g,"</p><p>");
  const img=f.image?`<figure style="margin:16px 0"><img src="${f.image.src}" alt="${esc(f.image.alt)}" loading="lazy" style="width:100%;border-radius:14px;border:1px solid var(--line);display:block"><figcaption class="small" style="margin-top:6px">${esc(f.image.cap)}</figcaption></figure>`:"";
  const an=f.analysis?`<div class="card"><h3>${esc(f.analysis.title)}</h3><div class="checks">${f.analysis.points.map((p,i)=>`<div class="c"><div class="x" style="background:var(--green-soft);color:var(--green)">${i+1}</div><div><span style="color:var(--ink);font-size:15px">${esc(p)}</span></div></div>`).join("")}</div><div class="tip" style="margin-bottom:6px"><b>Conclusão</b>${esc(f.analysis.lesson)}</div><p class="small">Fontes: ${f.analysis.links.map(l=>`<a href="${l.url}" target="_blank" rel="noopener" style="color:var(--green-d);font-weight:700">${esc(l.label)}</a>`).join(" · ")}</p></div>`:"";
  render(`<span class="chip">Informação para levar com você</span><h2>${esc(f.title)}</h2><div class="proof"><p>${proofText}</p><p class="source">${esc(f.source||"")}${links?`<br>${links}`:""}</p></div>${img}${an}
    <div class="tip"><b>Exemplo prático</b>${esc(f.example)}</div>
    <p class="small">Os exemplos são modelos ilustrativos. Ajuste o texto à situação real e aos canais adotados pela escola.</p>
    <button class="btn" id="continue">Continuar</button>`,"flow",progress);
  document.getElementById("continue").onclick=next;
}

function capture(){
  updateMeter(true);
  render(`<span class="chip">Seu raio-X está pronto</span><h2>Como seu nome deve aparecer no seu resultado?</h2><p class="lead">Vamos montar um resumo com base nas respostas que você deu.</p>
    <div class="formrow"><label for="nm">Seu nome</label><input id="nm" type="text" maxlength="60" autocomplete="name" placeholder="Ex.: Maria da Silva"></div>
    <div class="formrow"><label for="em">E-mail (opcional)</label><input id="em" type="email" autocomplete="email" placeholder="voce@exemplo.com"></div>
    <label class="ck"><input type="checkbox" id="consent"> Autorizo receber meu resultado e informações sobre a Cartilha Pais Presentes na Escola pelo e-mail informado. Posso cancelar o recebimento.</label>
    <p class="small">O resultado aparece nesta página mesmo que você não informe e-mail. Se quiser receber mensagens, informe o e-mail e marque a autorização.</p>
    <div class="err" id="err"></div><button class="btn" id="showresult">Ver meu resultado</button>
    <p class="foot">Seu nome será usado para personalizar esta tela. O envio e armazenamento de dados dependem da integração do formulário com uma ferramenta segura.</p>`,"capture",91);
  document.getElementById("showresult").onclick=async()=>{
    const name=document.getElementById("nm").value.trim().replace(/\s+/g," ");
    const email=document.getElementById("em").value.trim();
    const consent=document.getElementById("consent").checked;
    const err=document.getElementById("err");err.textContent="";
    if(name.length<2){err.textContent="Digite seu nome para personalizar o resultado.";document.getElementById("nm").focus();return;}
    if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){err.textContent="Confira o formato do e-mail ou deixe o campo em branco.";document.getElementById("em").focus();return;}
    if(email&&!consent){err.textContent="Para receber mensagens por e-mail, marque a autorização. Ou deixe o e-mail em branco.";return;}
    state.name=name;state.email=email;state.consent=consent;
    if(email&&consent&&WEBHOOK_URL){
      try{await fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nome:name,email,consentimento:true,papel:state.role,idade:state.age,respostas:state.answers})});track("Lead",{content_name:"quiz_pais_presentes"});}
      catch(e){console.warn("Não foi possível enviar o lead ao webhook.",e);}
    }
    result();
  };
}

      <details><summary>Como funciona a garantia?</summary><p>Você tem 30 dias de garantia. Se não ficar satisfeito(a), pode pedir o reembolso dentro desse prazo, conforme as condições informadas no checkout.</p></details>
    </div>
    <h3 style="margin-top:22px">Mais pais e mães que deram o próximo passo</h3>
    <div class="tsts">${["roberto","amanda","camila"].map(k=>tCard(k)).join("")}</div>
    <details class="moret"><summary>Ver mais 5 avaliações</summary><div class="tsts">${["fabio","priscila","andre","eduardo","larissa"].map(k=>tCard(k)).join("")}</div></details>
    <a class="btn sun buybtn" href="${CHECKOUT_URL}" target="_blank" rel="noopener">Quero a cartilha por R$ ${PRICE_TXT}</a>
    <p class="small" style="text-align:center;margin-top:8px">♾️ Acesso vitalício · ↩️ 30 dias de garantia</p>
    <p class="foot">Fontes legais citadas: ECA, art. 53, parágrafo único; LDB, arts. 12, VII, e 14. O material é educativo e não substitui orientação jurídica.</p>`,"result",100);
  updateMeter(false);
  setTimeout(()=>{const b=document.getElementById("sbar");if(b)b.style.width=sc+"%";let n=0;const el=document.getElementById("snum");const iv=setInterval(()=>{n=Math.min(sc,n+2);if(el)el.textContent=n;if(n>=sc)clearInterval(iv)},25)},200);
  const to=document.getElementById("toOffer");if(to)to.onclick=e=>{e.preventDefault();document.getElementById("offer").scrollIntoView({behavior:"smooth"})};
  document.querySelectorAll("#buy,.buybtn,#unlockCert").forEach(buy=>{buy.addEventListener("click",()=>{try{localStorage.setItem("ppe_nome",state.name)}catch(e){}track("InitiateCheckout",{value:PRICE,currency:"BRL"})});
  if(CHECKOUT_URL.includes("SEU-LINK-AQUI")){buy.addEventListener("click",e=>{e.preventDefault();alert("Antes de publicar, configure o link real do checkout no código.");});}});
}

function track(ev,data){try{if(window.fbq){if(["ViewContent","Lead","InitiateCheckout","Purchase"].includes(ev))window.fbq("track",ev,data||{});else window.fbq("trackCustom",ev,data||{});}}catch(e){}}
back.onclick=()=>{
  if(state.stage==="age"){intro();return;}
  if(state.stage==="ready"){age();return;}
  if(state.stage==="flow"){
    if(state.index>0){state.index--;step();}else{ready();}
    return;
  }
  if(state.stage==="capture"){state.index=FLOW.length-1;step();return;}
  if(state.stage==="result"){capture();return;}
};
function release(){
  updateMeter(false);
  let nm="";try{nm=localStorage.getItem("ppe_nome")||""}catch(e){}
  render(`<img src="img/logo.jpg" alt="Logo Pais Presentes na Escola" style="display:block;width:130px;height:auto;margin:0 auto 16px;background:#fff;border-radius:22px;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.07)">
    <span class="chip">✅ Pagamento confirmado</span><h1>Seu certificado está <span class="hl">liberado</span>!</h1>
    <p class="lead">Obrigado por adquirir a Cartilha Pais Presentes na Escola. O acesso ao material completo chega no e-mail informado na compra.</p>
    <div class="formrow"><label for="cn">Nome no certificado</label><input id="cn" type="text" maxlength="60" autocomplete="name" value="${esc(nm)}" placeholder="Digite seu nome completo"></div>
    <div id="certbox">${nm.length>=2?certHTML(nm):""}</div>
    <div class="err" id="err"></div>
    <button class="btn" id="printCert" type="button">Salvar certificado em PDF / imprimir</button>
    <p class="small" style="text-align:center;margin-top:6px">Na janela de impressão, escolha “Salvar como PDF”. Formato A4 horizontal.</p>`,"liberado",100,false);
  const inp=document.getElementById("cn"),box=document.getElementById("certbox"),err=document.getElementById("err");
  inp.oninput=()=>{const v=inp.value.trim().replace(/\s+/g," ");box.innerHTML=v.length>=2?certHTML(v):"";err.textContent="";try{localStorage.setItem("ppe_nome",v)}catch(e){}};
  document.getElementById("printCert").onclick=()=>{if(inp.value.trim().length<2){err.textContent="Digite seu nome para gerar o certificado.";inp.focus();return;}try{window.print()}catch(e){alert("Use o menu do navegador para imprimir ou salvar em PDF.")}};
  track("Purchase",{value:PRICE,currency:"BRL"});
}
let liberado=false;try{liberado=new URLSearchParams(location.search).get("acesso")==="liberado"}catch(e){}
if(liberado)release();else intro();
</script>
